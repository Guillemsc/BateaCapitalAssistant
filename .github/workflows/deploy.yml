name: Publish image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional image tag (defaults to this commit SHA)
        required: false
        type: string
      publish_to_docker_hub:
        description: Also publish to Docker Hub for Synology URL import
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress clean verify

  publish:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            if ! [[ "$INPUT_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "Invalid Docker image tag" >&2
              exit 1
            fi
            echo "value=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign in to Docker Hub
        if: inputs.publish_to_docker_hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.tag.outputs.value }}
            ${{ steps.image.outputs.name }}:latest
            ${{ inputs.publish_to_docker_hub && format('docker.io/{0}/bateacapitalassistant:{1}', vars.DOCKERHUB_USERNAME, steps.tag.outputs.value) || '' }}
            ${{ inputs.publish_to_docker_hub && format('docker.io/{0}/bateacapitalassistant:latest', vars.DOCKERHUB_USERNAME) || '' }}
