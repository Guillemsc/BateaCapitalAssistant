services:
  bateacapitalassistant:
    container_name: bateacapitalassistant
    network_mode: host
    environment:
      BATEA_OPENCODE_URL: http://127.0.0.1:4196
      BATEA_MCP_TOKEN: ${BATEA_MCP_TOKEN:?Required}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?Required}
  opencode:
    image: ghcr.io/anomalyco/opencode:1.2.15
    restart: unless-stopped
    network_mode: host
    working_dir: /workspace
    command: ["serve", "--hostname", "127.0.0.1", "--port", "4196"]
    environment:
      OPENCODE_ENABLE_EXA: "1"
      XDG_DATA_HOME: /opencode-data
      OPENCODE_CONFIG: /etc/batea-opencode.json
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?Required}
      BATEA_MCP_TOKEN: ${BATEA_MCP_TOKEN:?Required}
    volumes:
      - ./opencode-data:/opencode-data
      - ./opencode-workspace:/workspace
      - ./opencode.json:/etc/batea-opencode.json:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
